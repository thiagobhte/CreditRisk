# ============================================================
# docker-compose — Infraestrutura da solução de risco de crédito.
#
# Serviços:
#   postgres    → banco da solução: feature store, log de decisões, monitoramento
#   airflow     → orquestração com UI (http://localhost:8081, admin/admin)
#   api         → serviço de predição FastAPI (http://localhost:8000/docs)
#   streamlit   → painel de decisão com SHAP (http://localhost:8501)
#   pipeline    → roda o pipeline uma vez, sem Airflow (job efêmero)
#   monitoring  → checa drift de dados (job efêmero)
#
# Uso:
#   docker compose -f MLOps/docker-compose.yml up -d postgres  # banco
#   docker compose -f MLOps/docker-compose.yml up -d airflow   # UI do Airflow
#   docker compose -f MLOps/docker-compose.yml up -d api       # API de predição
#   docker compose -f MLOps/docker-compose.yml run --rm pipeline
#
# IMPORTANTE: os dados são montados por BIND-MOUNT de ../Dados para /data.
# (Antes usávamos um volume nomeado vazio, e por isso o pipeline não achava
#  os CSVs brutos e falhava.)
# ============================================================

services:

  # ----------------------------------------------------------
  # PostgreSQL — persistência da solução
  # ----------------------------------------------------------
  # É o banco da aplicação, não um detalhe de infraestrutura: guarda a ABT
  # (feature store lida pela API), o log de decisões de crédito (auditoria),
  # o registro de versões do modelo e o histórico de monitoramento.
  #
  # O schema.sql é montado em /docker-entrypoint-initdb.d, então o Postgres o
  # executa sozinho na PRIMEIRA subida (quando o volume ainda está vazio).
  # Para reaplicar depois, sem perder dados: python -m MLOps.db --init
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       creditrisk
      POSTGRES_USER:     creditrisk
      POSTGRES_PASSWORD: creditrisk
      # Checksums nas páginas de dados: o Postgres detecta corrupção silenciosa
      # em disco em vez de servir um dado errado sem avisar.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      # 5433 no host para não conflitar com um Postgres já instalado na máquina.
      # Dentro da rede do compose os serviços usam postgres:5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Os demais serviços esperam este healthcheck: subir a API antes do banco
      # aceitar conexões causaria falha no primeiro request.
      test: ["CMD-SHELL", "pg_isready -U creditrisk -d creditrisk"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ----------------------------------------------------------
  # Airflow — orquestração do pipeline (UI + scheduler)
  # ----------------------------------------------------------
  # Modo standalone: SQLite + SequentialExecutor, num único container.
  # Suficiente para demonstrar a DAG; em produção usaria Postgres + Celery/K8s.
  airflow:
    build:
      context: ..
      dockerfile: MLOps/airflow.Dockerfile
    image: credit-risk-airflow:latest
    ports:
      # 8081 no host (e não 8080) de propósito: é comum já haver outro Airflow
      # ocupando a 8080 na máquina, e um conflito de porta no meio de uma
      # demonstração ao vivo é o tipo de erro que dá para evitar de graça.
      - "8081:8080"
    environment:
      # A DAG mora junto do código do projeto, não em /opt/airflow/dags
      AIRFLOW__CORE__DAGS_FOLDER: /project/MLOps
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # PYTHONPATH: permite que as tasks importem config, DataPipeline e Model
      PYTHONPATH: /project
      # ISOLAMENTO: a DAG lê os CSVs brutos (read-only) mas escreve tudo —
      # clean_data, abt e o modelo — num volume separado (/demo). Assim uma
      # execução de demonstração NUNCA sobrescreve a ABT nem o modelo de
      # produção treinados na base completa.
      DATA_DIR: /demo
      MODEL_DIR: /demo/artifacts
      # Demo rápida: a DAG roda numa amostra (~2-3 min) em vez da base completa
      # (~25 min) — tempo demais para uma apresentação ao vivo.
      NUM_ROWS: "30000"
      # A task load_feature_store publica a ABT no banco da aplicação (que é
      # compartilhado, e não isolado como o /demo: a API precisa ler de lá).
      DB_HOST: postgres
      ABT_LOAD_LIMIT: "20000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../:/project
      - airflow_demo:/demo                 # saídas da demo (isoladas)
      - ../Dados/raw_data:/demo/raw_data:ro # dados brutos, somente leitura
    # Script explícito: db migrate → cria admin → scheduler + webserver.
    # (Encadear isso inline no YAML com && e & é frágil — ver o script.)
    command: ["bash", "/project/MLOps/airflow-entrypoint.sh"]

  # ----------------------------------------------------------
  # API de predição (serviço de vida longa)
  # ----------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: credit-risk:latest
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /data
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../:/project
      - ../Dados:/data
    healthcheck:
      # Usa o /health: o modelo precisa estar treinado para ficar "healthy"
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ----------------------------------------------------------
  # Streamlit — painel de decisão com explicabilidade (SHAP)
  # ----------------------------------------------------------
  # O painel NÃO carrega o modelo: é um cliente HTTP da API. Existe um único
  # lugar que pontua crédito, e o painel passa por ele como qualquer outro
  # consumidor — inclusive para que a decisão vista na tela fique registrada
  # em serving.predictions, como toda decisão da API.
  streamlit:
    build:
      context: ..
      dockerfile: Dockerfile
    image: credit-risk:latest
    command: >
      streamlit run app/streamlit_app.py
      --server.port 8501
      --server.address 0.0.0.0
      --server.headless true
    ports:
      - "8501:8501"
    environment:
      DATA_DIR: /data
      DB_HOST: postgres
      # Dentro da rede do compose os serviços se enxergam pelo NOME do serviço.
      # Rodando o painel no host, exporte API_URL=http://localhost:8000
      API_URL: http://api:8000
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - ../:/project
      - ../Dados:/data
    restart: unless-stopped

  # ----------------------------------------------------------
  # Pipeline sem Airflow (job efêmero — roda e encerra)
  # ----------------------------------------------------------
  pipeline:
    build:
      context: ..
      dockerfile: Dockerfile
    image: credit-risk:latest
    command: python -m MLOps.pipeline_orchestration
    environment:
      DATA_DIR: /data
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../:/project
      - ../Dados:/data

  # ----------------------------------------------------------
  # Monitoramento (job efêmero — rode agendado, ou pela DAG)
  # ----------------------------------------------------------
  # Roda as três camadas e PERSISTE o resultado em mlops.monitoring_runs.
  #
  # A versão anterior deste serviço comparava `abt.csv` com ele mesmo e gravava
  # um JSON solto: o PSI dava zero por construção, e o relatório era
  # sobrescrito a cada execução. Não havia o que detectar nem série histórica.
  #
  # Para demonstrar a detecção sobre uma população deslocada:
  #   docker compose -f MLOps/docker-compose.yml run --rm monitoring \
  #     python -m MLOps.monitoring --data-drift --simular-choque
  monitoring:
    build:
      context: ..
      dockerfile: Dockerfile
    image: credit-risk:latest
    command: python -m MLOps.monitoring --tudo
    environment:
      DATA_DIR: /data
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../:/project
      - ../Dados:/data

volumes:
  # Dados do PostgreSQL. Volume nomeado (e não bind-mount) para o banco manter
  # o controle das permissões dos arquivos e sobreviver a `compose down`.
  # Para zerar o banco e reaplicar o schema do zero: docker compose down -v
  pgdata:

  # Saídas das execuções de demonstração do Airflow — mantidas fora de Dados/
  # para não sobrescrever a ABT e o modelo de produção.
  airflow_demo:
